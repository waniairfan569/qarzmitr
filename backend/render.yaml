services:
  - type: web
    name: qarzmitr-backend
    runtime: node
    # Singapore is closer to Pakistan than the US default; change if your users move.
    region: singapore
    # Starter is recommended because persistent disks are unavailable on the free plan.
    # Free-tier option: change this to "free" and remove the disk block; data will be ephemeral.
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # The app currently has no public health route; see DEPLOYMENT.md before relying on this check.
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: qarzmitr-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: OSS_ACCESS_KEY_ID
        sync: false
      - key: OSS_ACCESS_KEY_SECRET
        sync: false
      - key: OSS_BUCKET_NAME
        sync: false
