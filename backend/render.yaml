services:
  - type: web
    name: qarzmitr-backend
    runtime: node
    # Singapore is closer to Pakistan than the US default; change if your users move.
    region: singapore
    # Starter is recommended because persistent disks are unavailable on the free plan.
    # Free-tier option: change this to "free" and remove the disk block; data will be ephemeral.
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: qarzmitr-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL, e.g. https://qarzmitr.vercel.app (no trailing slash)
      - key: FRONTEND_ORIGIN
        sync: false
      # Both live on the persistent disk so a redeploy keeps accounts and photos.
      - key: DATABASE_URL
        value: /opt/render/project/src/data/qarzmitr.sqlite
      - key: UPLOADS_DIR
        value: /opt/render/project/src/data/uploads
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
